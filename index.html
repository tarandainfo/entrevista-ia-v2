<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDA · InfoNegocios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fondo de malla líquida: cubre toda la página, siempre
         animado (calmo antes de arrancar, se intensifica al
         hablar, más activo aún si nadie interactúa por un
         rato, y con un matiz sutil según el tema). -->
    <canvas id="fondo-malla"></canvas>

    <!-- Pantalla 1: inicio -->
    <section id="pantalla-inicio" class="pantalla activa">

        <p class="marca">LEDA</p>
        <p class="tagline">InfoNegocios Paraguay</p>

        <p class="frase-rotativa" id="frase-rotativa"></p>

        <div class="botones-modo">
            <button class="boton-modo" id="modo-infobrand" data-modo="infobrand">
                <span class="boton-modo-icono">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="8" width="18" height="12" rx="2"></rect>
                        <path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <path d="M3 13h18"></path>
                    </svg>
                </span>
                <span class="boton-modo-texto">
                    <span class="boton-modo-titulo">InfoBrand</span>
                    <span class="boton-modo-desc">Entrevista de marca/empresa</span>
                </span>
            </button>

            <button class="boton-modo" id="modo-leda" data-modo="leda">
                <span class="boton-modo-icono">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-4.24 7.3A8.5 8.5 0 0 1 3 12.5 8.5 8.5 0 1 1 21 11.5z"></path>
                        <path d="M8.5 12h.01M12 12h.01M15.5 12h.01"></path>
                    </svg>
                </span>
                <span class="boton-modo-texto">
                    <span class="boton-modo-titulo">Habla con LEDA</span>
                    <span class="boton-modo-desc">Entrevista corta de prueba</span>
                </span>
            </button>

            <button class="boton-modo" id="modo-speaker" data-modo="speaker">
                <span class="boton-modo-icono">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                        <path d="M5 10a7 7 0 0 0 14 0"></path>
                        <path d="M12 17v5"></path>
                    </svg>
                </span>
                <span class="boton-modo-texto">
                    <span class="boton-modo-titulo">Speaker</span>
                    <span class="boton-modo-desc">Entrevista a un speaker del evento</span>
                </span>
            </button>
        </div>

        <p class="atraeme" id="atraeme">¡Hablá con LEDA!</p>

    </section>

    <!-- Pantalla 2: la entrevista en curso -->
    <section id="pantalla-entrevista" class="pantalla">

        <div class="contenido-entrevista">

            <p class="marca-chica">LEDA</p>

            <div class="progreso" id="progreso"></div>

            <p id="estado">
                <span class="punto-estado" id="punto-estado"></span>
                <span id="texto-estado">Conectando...</span>
            </p>

        </div>

    </section>

    <!-- Cronómetro -->
    <div class="cronometro" id="cronometro">00:00</div>

    <!-- Chat en vivo: última frase dicha, en una tarjeta -->
    <div class="chat-card" id="chat-card">
        <p class="quien" id="chat-quien"></p>
        <p class="texto" id="chat-texto"></p>
    </div>

    <!-- Código QR para seguir a InfoNegocios -->
    <div class="qr-card" id="qr-card">
        <img src="assets/qr-infonegocios.png" alt="Seguí a InfoNegocios en Instagram">
        <p>@infonegociospy</p>
    </div>

    <!-- Botón para finalizar manualmente -->
    <button class="finalizar" id="finalizar">Finalizar entrevista</button>

    <!-- Crédito de autoría -->
    <p class="credito">InfoNegocios Paraguay</p>

    <script src="fondo.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
