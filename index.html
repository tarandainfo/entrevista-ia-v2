<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDA · InfoNegocios</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla 1: inicio, antes de arrancar la entrevista. -->
    <section id="pantalla-inicio" class="pantalla activa">

        <p class="marca">LE<span>DA</span></p>
        <p class="tagline">InfoNegocios Paraguay</p>

        <button id="comenzar">Comenzar entrevista</button>

    </section>

    <!-- Pantalla 2: la entrevista en curso, con el fondo de
         partículas que se intensifica cuando LEDA habla. -->
    <section id="pantalla-entrevista" class="pantalla">

        <canvas id="fondo-particulas"></canvas>

        <div class="contenido-entrevista">

            <p class="marca-chica">LEDA</p>

            <p id="estado">Conectando...</p>

            <p id="transcripcion"></p>

        </div>

    </section>

    <script src="particles.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
