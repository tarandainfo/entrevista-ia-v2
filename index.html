<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDA · InfoNegocios</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fondo de partículas: cubre toda la página, siempre
         animado (calmo antes de arrancar, se intensifica
         cuando LEDA habla). -->
    <canvas id="fondo-particulas"></canvas>

    <!-- Pantalla 1: inicio, antes de arrancar la entrevista. -->
    <section id="pantalla-inicio" class="pantalla activa">

        <p class="marca">LE<span class="reactivo-audio">DA</span></p>
        <p class="tagline">InfoNegocios Paraguay</p>

        <button id="comenzar">Comenzar entrevista</button>

    </section>

    <!-- Pantalla 2: la entrevista en curso. -->
    <section id="pantalla-entrevista" class="pantalla">

        <div class="contenido-entrevista">

            <p class="marca-chica reactivo-audio">LEDA</p>

            <div class="progreso" id="progreso"></div>

            <p id="estado">
                <span class="punto-estado" id="punto-estado"></span>
                <span id="texto-estado">Conectando...</span>
            </p>

        </div>

    </section>

    <script src="particles.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
