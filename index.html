<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrevista IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="entrevista">

        <h1>Entrevista IA</h1>

        <!-- Indicador simple de estado: sin avatar por ahora,
             solo un círculo que cambia de brillo/color según
             lo que está haciendo la IA. -->
        <div id="indicador" class="indicador">
            <div class="indicador-nucleo"></div>
        </div>

        <p id="estado">Preparando entrevista...</p>

        <p id="transcripcion"></p>

        <button id="comenzar">Comenzar entrevista</button>

    </main>

    <script src="script.js" defer></script>
</body>
</html>
